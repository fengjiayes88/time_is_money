<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方向A Demo · 极简数显小组件</title>
<style>
  :root {
    --bg0: #0E0F13;
    --bg1: #171A21;
    --ink: #F5F5F7;
    --label: #9698A3;
    --faint: #5C5F6A;
    --accent: #7DB8FF;
    --accent-dim: rgba(125, 184, 255, .35);
    --line: rgba(255, 255, 255, .07);
    --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
    --sans: "Microsoft YaHei UI", "Segoe UI", sans-serif;
  }
  body.light {
    --bg0: #F5F5F7;
    --bg1: #FFFFFF;
    --ink: #1D1D1F;
    --label: #6E6E73;
    --faint: #AEAEB2;
    --accent: #0A84FF;
    --accent-dim: rgba(10, 132, 255, .25);
    --line: rgba(0, 0, 0, .06);
  }
  /* ---------- 加班压榨模式：同一版式换红色警报 ---------- */
  body.alert {
    --bg0: #160B0C;
    --bg1: #1D0F10;
    --ink: #F5F5F7;
    --label: #A98A8A;
    --faint: #6E4A4A;
    --accent: #FF5252;
    --accent-dim: rgba(255, 82, 82, .4);
    --line: rgba(255, 82, 82, .12);
  }
  body.alert .widget { animation: alertPulse 2.2s ease-in-out infinite; }
  @keyframes alertPulse {
    0%, 100% { box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 rgba(255,82,82,0); }
    50% { box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05), 0 0 36px rgba(255,82,82,.18); }
  }
  body.alert .amount { animation: numPulse 2.2s ease-in-out infinite; }
  @keyframes numPulse {
    0%, 100% { text-shadow: 0 0 24px var(--accent-dim); }
    50% { text-shadow: 0 0 40px rgba(255, 82, 82, .6); }
  }
  /* 结束加班按钮（仅压榨模式显示） */
  .end-btn {
    display: none; margin: 14px auto 0; padding: 8px 26px;
    font-size: 12px; font-family: var(--sans); letter-spacing: 2px;
    color: #FF8585; background: rgba(255, 82, 82, .1);
    border: 1px solid rgba(255, 82, 82, .35); border-radius: 999px; cursor: pointer;
    transition: background .2s;
  }
  .end-btn:hover { background: rgba(255, 82, 82, .22); }
  body.alert .end-btn { display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: #2b2d33;
    display: flex; align-items: center; justify-content: center;
    gap: 40px;
  }
  /* ---------- 小组件本体 348×452，模拟真实窗口 ---------- */
  .widget {
    width: 348px; height: 452px; border-radius: 24px; overflow: hidden;
    background: linear-gradient(165deg, var(--bg0), var(--bg1) 70%);
    box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
    display: flex; flex-direction: column;
    padding: 18px 22px 20px;
    position: relative;
    transition: background .4s;
  }
  /* 顶部自绘标题栏 */
  .titlebar { display: flex; align-items: center; justify-content: space-between; }
  .titlebar .name { font-size: 12px; color: var(--label); letter-spacing: 2px; }
  .icon-btn {
    width: 26px; height: 26px; border-radius: 8px; border: none; cursor: pointer;
    background: transparent; color: var(--label);
    font-size: 14px; display: grid; place-items: center;
    transition: background .2s, color .2s;
  }
  .icon-btn:hover { background: var(--line); color: var(--ink); }
  .date-line { margin-top: 6px; font-size: 11px; color: var(--faint); }

  /* 主数字区 */
  .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .main .cap { font-size: 12px; color: var(--label); letter-spacing: 3px; margin-bottom: 10px; }
  .amount { font-family: var(--mono); font-weight: 700; color: var(--accent);
            display: flex; align-items: baseline; line-height: 1;
            text-shadow: 0 0 24px var(--accent-dim); }
  .amount .int { font-size: 56px; letter-spacing: -1px; }
  .amount .dec { font-size: 26px; margin-left: 2px; }
  .countdown { margin-top: 12px; font-family: var(--mono); font-size: 13px; color: var(--label); }

  /* 今日进度条 */
  .progress { margin: 18px 2px 0; }
  .progress .track { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .progress .fill { height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    box-shadow: 0 0 8px var(--accent-dim);
    transition: width 1s linear; }
  .progress .marks { display: flex; justify-content: space-between; margin-top: 6px;
    font-size: 10px; color: var(--faint); font-family: var(--mono); }

  /* 底部三栏数据 */
  .stats { display: flex; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .stat { flex: 1; text-align: center; }
  .stat .k { font-size: 10px; color: var(--faint); margin-bottom: 5px; }
  .stat .v { font-size: 14px; font-weight: 700; color: var(--ink); font-family: var(--mono); }
  .stat .v.cjk { font-family: var(--sans); }

  .theme-dots { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; }
  .theme-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); cursor: pointer; }
  .theme-dots i.on { background: var(--accent); }

  .note { color: #888; font-size: 12px; max-width: 220px; line-height: 1.8; }
</style>
</head>
<body>

<div class="widget" id="w">
  <div class="titlebar">
    <span class="name">时间就是金钱</span>
    <button class="icon-btn" title="设置">⚙</button>
  </div>
  <div class="date-line" id="dateLine">—</div>

  <div class="main">
    <div class="cap" id="cap">今日已赚（元）</div>
    <div class="amount">
      <span class="int" id="amtInt">0</span><span class="dec" id="amtDec">.00</span>
    </div>
    <div class="countdown" id="cd">—</div>
    <button class="end-btn" id="endBtn">结束加班</button>
  </div>

  <div class="progress">
    <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
    <div class="marks"><span id="startMark">09:00</span><span id="pct">0%</span><span id="endMark">18:00</span></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">本月已赚（元）</div><div class="v" id="svMonth">—</div></div>
    <div class="stat"><div class="k">距发薪</div><div class="v cjk" id="svPay">—</div></div>
    <div class="stat"><div class="k" id="pssLabel">秒薪（元）</div><div class="v" id="svPss">—</div></div>
  </div>

  <div class="theme-dots"><i id="dotDark" class="on"></i><i id="dotLight"></i><i id="dotRed"></i></div>
</div>

<div class="note">
  方向 A · 极简数显小组件 Demo<br>
  深色纯色渐变底，无壁纸无玻璃面板；主数字整数/小数分字号；今日进度条把时间可视化。点击右下角圆点切换浅色变体。数字为模拟数据。
</div>

<script>
// 截图模式：#shot 时隐藏说明文字，小组件填满整个视口
if (location.hash.startsWith("#shot")) {
  if (location.hash === "#shot-light") {
    document.body.classList.add("light");
    document.getElementById("dotLight").classList.add("on");
    document.getElementById("dotDark").classList.remove("on");
  }
  if (location.hash === "#shot-red") {
    document.body.classList.add("alert");
    document.getElementById("dotRed").classList.add("on");
    document.getElementById("dotDark").classList.remove("on");
  }
  document.querySelector(".note").style.display = "none";
  const w = document.querySelector(".widget");
  w.style.boxShadow = "none";
  w.style.position = "fixed";
  w.style.left = "0";
  w.style.top = "0";
  w.style.margin = "0";
  document.body.style.background = "transparent";
  document.body.style.overflow = "hidden";
  document.documentElement.style.overflow = "hidden";
}

// ---- 模拟参数（对应 config.json 语义）----
const CFG = { salary: 12000, start: "09:00", end: "18:00", payday: 1 };
const now0 = new Date();
const daysInMonth = new Date(now0.getFullYear(), now0.getMonth() + 1, 0).getDate();
const workdays = Math.round(daysInMonth * 5 / 7);            // 粗略应出勤天数
const dailySec = (toS(CFG.end) - toS(CFG.start));            // 每日工作秒数
const pss = CFG.salary / (workdays * dailySec);              // 秒薪

function toS(hm) { const [h, m] = hm.split(":").map(Number); return h * 3600 + m * 60; }
const pad = n => String(n).padStart(2, "0");
const fmtMoney = n => n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function tick() {
  const n = new Date();
  const sec = n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds();
  const alert = document.body.classList.contains("alert");

  if (alert) {
    // 压榨模式：主数字 = 老板压榨金额；预览时未到下班点用模拟时长
    let over = Math.max(0, sec - toS(CFG.end)), simulated = false;
    if (over === 0) { over = 2 * 3600 + 13 * 60 + n.getSeconds(); simulated = true; }
    const amt = pss * over;
    const [i, d] = fmtMoney(amt).split(".");
    document.getElementById("amtInt").textContent = i;
    document.getElementById("amtDec").textContent = "." + d;
    document.getElementById("cap").textContent = simulated ? "老板压榨金额（演示）" : "老板压榨金额（元）";
    document.getElementById("cd").textContent = "本次加班 " + pad(Math.floor(over / 3600)) + ":" + pad(Math.floor(over % 3600 / 60)) + ":" + pad(over % 60);
    // 进度条变加班时长条（4 小时满格），中间显示每秒损失
    document.getElementById("fill").style.width = Math.min(100, over / 14400 * 100) + "%";
    document.getElementById("pct").textContent = "+" + pss.toFixed(4) + "/s";
    document.getElementById("startMark").textContent = "下班 " + CFG.end;
    document.getElementById("endMark").textContent = "加班中";
    document.getElementById("pssLabel").textContent = "每秒损失";
    document.getElementById("svPss").textContent = pss.toFixed(4);
    const wk2 = "日一二三四五六"[n.getDay()];
    document.getElementById("dateLine").textContent = `${n.getMonth() + 1}月${n.getDate()}日 周${wk2} · ⚠ 加班中`;
  } else {
    const paid = Math.max(0, Math.min(dailySec, sec - toS(CFG.start)));
    const today = pss * paid;

    // 主数字
    const [i, d] = fmtMoney(today).split(".");
    document.getElementById("amtInt").textContent = i;
    document.getElementById("amtDec").textContent = "." + d;
    document.getElementById("cap").textContent = "今日已赚（元）";

    // 倒计时
    const left = toS(CFG.end) - sec;
    const cd = document.getElementById("cd");
    if (left > 0) {
      cd.textContent = "距离下班 " + pad(Math.floor(left / 3600)) + ":" + pad(Math.floor(left % 3600 / 60)) + ":" + pad(left % 60);
    } else {
      cd.textContent = "已下班";
    }

    // 进度条
    const pct = Math.min(100, paid / dailySec * 100);
    document.getElementById("fill").style.width = pct + "%";
    document.getElementById("pct").textContent = pct.toFixed(1) + "%";
    document.getElementById("startMark").textContent = CFG.start;
    document.getElementById("endMark").textContent = CFG.end;
    document.getElementById("pssLabel").textContent = "秒薪（元）";
    document.getElementById("svPss").textContent = pss.toFixed(4);

    // 顶部日期行
    const wk = "日一二三四五六"[n.getDay()];
    document.getElementById("dateLine").textContent =
      `${n.getMonth() + 1}月${n.getDate()}日 周${wk} · ${left > 0 && sec >= toS(CFG.start) ? "上班中" : sec < toS(CFG.start) ? "未上班" : "已下班"}`;
  }

  // 底部统计（模拟）
  const dayOfMonth = n.getDate();
  const monthEarned = pss * dailySec * Math.max(0, dayOfMonth - 1) * 5 / 7 + pss * Math.max(0, Math.min(dailySec, sec - toS(CFG.start)));
  document.getElementById("svMonth").textContent = fmtMoney(monthEarned);
  const pd = CFG.payday >= dayOfMonth ? CFG.payday - dayOfMonth
          : new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate() - dayOfMonth + CFG.payday;
  document.getElementById("svPay").textContent = pd === 0 ? "今天发薪" : pd + " 天";
}
tick();
setInterval(tick, 1000);

// 深浅 / 压榨模式切换
const widget = document.getElementById("w");
function setLight(on) {
  widget.classList.toggle("light", on);
  document.getElementById("dotLight").classList.toggle("on", on);
  document.getElementById("dotDark").classList.toggle("on", !on);
}
function setAlert(on) {
  document.body.classList.toggle("alert", on);
  document.getElementById("dotRed").classList.toggle("on", on);
  if (on) { widget.classList.remove("light"); document.getElementById("dotLight").classList.remove("on"); document.getElementById("dotDark").classList.remove("on"); }
  else { document.getElementById("dotDark").classList.add("on"); }
  tick();
}
document.getElementById("dotDark").onclick = () => { setAlert(false); setLight(false); };
document.getElementById("dotLight").onclick = () => { setAlert(false); setLight(true); };
document.getElementById("dotRed").onclick = () => setAlert(true);
document.getElementById("endBtn").onclick = () => setAlert(false);
</script>
</body>
</html>
